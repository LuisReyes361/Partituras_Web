<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Partituras | ParLH</title>

    <!-- El navbar se carga primero para que el CSS de la página pueda sobrescribirlo -->
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/estilosBuscador.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

    <header class="navbar">
        <div class="logo">ParLH</div>

        <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
            <i class="fas fa-bars"></i>
        </button>

        <div class="menu-right">
            <nav>
                <ul class="nav-links">
                    <li><a href="inicio.html">Inicio</a></li>
                    <li><a href="index.html">Subir Partitura</a></li>
                    <li><a href="https://wa.me/7716841976?text=Hola,%20necesito%20soporte%20t%C3%A9cnico">Soporte</a></li>
                </ul>
            </nav>

            <!-- Antes esto era un <li class="social-icons"> suelto, sin <ul> ni
                 <ol> que lo contuvieran. -->
            <div class="social-icons">
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://wa.me/7716841976?text=Hola,%20me%20interesa%20saber%20m%C3%A1s%20sobre%20sus%20servicios"
                    aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </header>

    <main class="fondo">

        <div class="buscador">
            <input type="text" id="search"
                placeholder="Escribe el nombre de la partitura para buscarla...">
        </div>

        <div class="grid-container" id="resultados"></div>

    </main>

    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="scripbuscar.js"></script>

</body>

</html>
