<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arill | Biblioteca de partituras</title>
    <meta name="description" content="Biblioteca abierta de partituras para músicos. Busca, escucha y descarga.">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/estilosBuscador.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body data-pagina="explorar">

    <div class="pantalla-bienvenida" id="pantallaBienvenida">
        <h1>Estudia sin límites</h1>
        <p>Bienvenido de nuevo a la biblioteca más grande de partituras.</p>
        <button class="btn" type="button" id="btnEntrar">Entrar</button>
    </div>

    <main>
        <section class="cabecera-azul">
            <div class="contenedor">
                <h1>Explorar partituras</h1>
                <p>Acordes, dúos, instrumentales. Encuentra la partitura que estabas buscando.</p>

                <form class="buscador-barra" id="formBusqueda" role="search">
                    <input type="search" id="search" name="q"
                        placeholder="Busca por título o banda"
                        aria-label="Buscar partituras">
                    <button type="submit" class="btn btn-claro">Buscar</button>
                </form>
            </div>
        </section>

        <section class="resultados-zona">
            <div class="contenedor">
                <div class="resultados-cabecera" id="resultadosCabecera" hidden>
                    <p class="resultados-conteo" id="resultadosConteo"></p>

                    <label class="orden-control" for="orden">
                        Ordenar por
                        <select id="orden">
                            <option value="recientes">Más recientes</option>
                            <option value="nombre">Nombre (A-Z)</option>
                        </select>
                    </label>
                </div>

                <div class="grid-container" id="resultados"></div>
            </div>
        </section>
    </main>

    <script src="bienvenida.js"></script>
    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="scripbuscar.js"></script>

</body>

</html>
