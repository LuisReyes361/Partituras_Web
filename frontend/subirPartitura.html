<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir partitura | arill</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
</head>

<body data-pagina="subir">

    <div class="pantalla-bienvenida" id="pantallaBienvenida">
        <h1>Estudia sin límites</h1>
        <p>Bienvenido de nuevo a la biblioteca más grande de partituras.</p>
        <button class="btn" type="button" id="btnEntrar">Entrar</button>
    </div>

    <main>

        <section class="cabecera-azul">
            <div class="contenedor">
                <h1>Subir partitura</h1>
                <p>Comparte un arreglo con la comunidad. Solo necesitas un PDF.</p>
            </div>
        </section>

        <section class="subir-zona">
            <div class="contenedor">
                <div class="subir-panel">

                    <div class="ilustracion" aria-hidden="true">
                        <span class="pieza pdf"><i class="fas fa-file-pdf"></i></span>
                        <i class="fas fa-arrow-right-long flecha"></i>
                        <span class="pieza carpeta"><i class="fas fa-folder-open"></i></span>
                    </div>

                    <h2>Sube tu partitura</h2>

                    <form id="uploadForm" enctype="multipart/form-data">

                        <div class="campo">
                            <label for="archivo">Partitura en PDF</label>

                            <div class="campo-archivo">
                                <label class="btn-seleccionar" for="archivo">
                                    <i class="fas fa-upload"></i> Seleccionar archivo
                                </label>
                                <span class="estado-archivo" id="estadoArchivo">
                                    un archivo seleccionado
                                </span>
                                <input type="file" id="archivo" name="archivo"
                                    accept="application/pdf,.pdf" required>
                            </div>

                            <p class="campo-ayuda">Solo PDF, hasta 25 MB.</p>
                        </div>

                        <div class="campo">
                            <label for="nombre">Nombre de la partitura</label>
                            <input type="text" id="nombre" name="nombre"
                                placeholder="Ej: Mi Ultimo Deseo - Banda La Adictiva"
                                maxlength="120" required>
                        </div>

                        <button type="submit">Subir partitura</button>
                    </form>

                </div>
            </div>
        </section>

    </main>

    <script src="bienvenida.js"></script>
    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="script.js"></script>

</body>

</html>
