<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir partitura | arill</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
</head>

<body data-pagina="subir">

    <main>
        <section class="subir-zona">
            <div class="contenedor">
                <div class="subir-panel">
                    <h1>Sube tu partitura</h1>
                    <p class="intro">
                        Comparte un arreglo con la comunidad. Solo necesita ser un PDF.
                    </p>

                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="campo">
                            <label for="nombre">Nombre de la partitura</label>
                            <input type="text" id="nombre" name="nombre"
                                placeholder="Ej: Mi Ultimo Deseo - Banda La Adictiva"
                                maxlength="120" required>
                        </div>

                        <div class="campo">
                            <label for="archivo">Archivo PDF</label>
                            <input type="file" id="archivo" name="archivo" accept="application/pdf,.pdf" required>
                            <p class="campo-ayuda">Solo archivos PDF, hasta 25 MB.</p>
                        </div>

                        <button type="submit">Subir partitura</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="menu.js"></script>
    <script src="script.js"></script>

</body>

</html>
